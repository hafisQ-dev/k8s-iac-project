---
- name: Kubernetes Preparatory Stage for AWS Free Tier
  hosts: k8s_cluster
  become: true
  handlers:

    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted

  tasks:
    # --- Stage 1 --- Kubernetes System Preparation
    # Task 1.1: Swap file for AWS free tier
    - name: Swap-on file creating for kubernetes
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile

    - name: Making root authority for swap file permission
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'

    - name: Returning file to swap form
      ansible.builtin.command: mkswap /swapfile
      register: mkswap_result
      changed_when: mkswap_result.rc == 0
      failed_when: false

    - name: Activate swap field
      ansible.builtin.command: swapon /swapfile
      register: swapon_result
      changed_when: swapon_result.rc == 0
      failed_when: false

    - name: Altering swap file permanently to /etc/fstab
      ansible.posix.mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    # Task 1.2 Kubernetes Kernel Modules
    - name: Creating config file for overlay and br_netfilter
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Adding kernel modules to linux kernel
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    # Task 1.3 IP forwarding by sysctl
    - name: Kubernetes sysctl config docs creating
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: '0644'

    - name: Configure kernel parameters at runtime
      ansible.builtin.command: sysctl --system
      changed_when: false

    # Stage 2 : Container Runtime (CRI) & Essential Packages
    - name: Installing essential packages
      ansible.builtin.apt:
        update_cache: false
        #force_apt_get: true
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
          - conntrack ## Kubernetes kube-proxy/kubelet önkoşulu
          - ipset # IPVS modunda çalışan kube-proxy için önerilir
        state: present

    - name: Creating Keyring folder
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Installing containerd gpg keys
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Adding to the System Docker APT repo
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: amd64
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Installing Kubernetes gpg keys
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'

    - name: Adding to the System Kubernetes APT repo
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: https://pkgs.k8s.io/core:/stable:/v1.31/deb/
        suites: /
        signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        state: present

    # Task 2.3 Kubernetes tools setup
    - name: Install Kubernetes package
      ansible.builtin.apt:
        name:
          - kubeadm
          - kubectl
          - kubelet
        state: present
        update_cache: true

    - name: apt-mark selection
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubectl
        - kubelet

    - name: Start and enable kubelet service
      ansible.builtin.systemd_service:
        name: kubelet
        state: started
        enabled: true

    # Task 2.2 Containerd and cgroup configuration
    - name: Install containerd.io package
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: true

    - name: Creating containerd folder under /etc
      ansible.builtin.file:
        path: /etc/containerd
        mode: '0755'
        state: directory

    - name: Producing containerd configuration and activating SystemdCgroup setting
      ansible.builtin.shell: |
        containerd config default | \ 
        sed 's/SystemdCgroup = false/SystemdCgroup = true/g' | \
        sed 's|registry.k8s.io/pause:3.[0-9]|registry.k8s.io/pause:3.10|g' > /etc/containerd/config.toml
      notify: Restart containerd

    - name: Initialization containerd and doing enable
      ansible.builtin.systemd_service:
        name: containerd
        state: started
        enabled: true
    - name: Allow kubelet to run with swap enabled
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        line: 'KUBELET_EXTRA_ARGS="--fail-swap-on=false"'
        create: yes
      notify: Restart kubelet

- name: Initialization of Control Plane
  hosts: master
  become: true
  tasks:
    # Task 3 Initialization control plane (master) node
    - name: kubeadm init
      ansible.builtin.shell: |
        kubeadm init \
          --pod-network-cidr=10.244.0.0/16 \
          --cri-socket=unix:///var/run/containerd/containerd.sock \
          --ignore-preflight-errors=Swap,Mem
      args:
        creates: /etc/kubernetes/admin.conf
      register: kube_init_outputs

    - name: Creating .kube folder
      ansible.builtin.file:
        path: /root/.kube
        mode: '0700'
        state: directory

    - name: Copy admin.conf file to /root/.kube/config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: '0600'

    # Task 3.5: Calico uygulamadan önce API Server'ın 6443 portunu dinlediğinden emin ol
    - name: Wait for Kubernetes API server to be operational
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        delay: 5
        timeout: 120

    # Task 4.1: Tigera Operator Install
    - name: Calico custom resource definition and tigera operator install
      ansible.builtin.command: >
        kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/tigera-operator.yaml
      environment:
        KUBECONFIG: /root/.kube/config
      register: operator_results
      until: operator_results.rc == 0 or 'already exists' in operator_results.stderr
      retries: 10
      delay: 5
      failed_when:
        - operator_results.rc != 0
        - "'already exists' not in operator_results.stderr"
      changed_when: "'created' in operator_results.stdout or 'configured' in operator_results.stdout"

    # Task 4.2: Custom Resources Install
    - name: Calico Custom Resource (Network Structure)
      ansible.builtin.command: >
        kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/custom-resources.yaml
      environment:
        KUBECONFIG: /root/.kube/config
      register: cni_results
      until: cni_results.rc == 0 or 'already exists' in cni_results.stderr
      retries: 10
      delay: 5
      failed_when:
        - cni_results.rc != 0
        - "'already exists' not in cni_results.stderr"
      changed_when: "'created' in cni_results.stdout or 'configured' in cni_results.stdout"

    # Task 5 Creating Join Command on Master node
    - name: Making a command named join_command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

    - name: Register join command to ansible memory
      ansible.builtin.set_fact:
        join_command: "{{ join_command_raw.stdout }} --ignore-preflight-errors=Swap"

- name: Worker node operations
  hosts: workers
  become: true
  tasks:
    - name: Add Worker node to The Cluster
      ansible.builtin.shell: "{{ hostvars[groups['master'][0]]['join_command'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      register: worker_join_results

    - name: Confirm worker node added to the cluster
      ansible.builtin.debug:
        msg: "Worker nodes added to the Cluster successfully!"
      when: worker_join_results is not skipped

- name: Notice Status of joining Worker Nodes
  hosts: master
  become: true
  tasks:
    - name: Make a List for status of Nodes
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes
      register: nodes_status
      changed_when: false

    - name: Print the status of Nodes
      ansible.builtin.debug:
        var: nodes_status.stdout_lines
