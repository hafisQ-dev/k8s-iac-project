---
- name: Kebernetes Preparatory Stage for AWS Free Tier
  hosts: k8s_cluster
  become: true
  tasks:
      # --- Stage 1 --- Kubernetses System Preparetion
      # Task 1.1: Swap file for AWS free tier
    - name: Swap-on file creating for kubernetese
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile

    - name: Making root authority for swap file permission
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'

    - name: returning file  to swap form
      ansible.builtin.command: mkswap /swapfile
      register: mkswap_result
      changed_when: mkswap_result.rc == 0
      failed_when: false

    - name: Activate swap field
      ansible.builtin.command: swapon /swapfile
      register: swapon_result
      changed_when: swapon_result.rc == 0
      failed_when: false

    - name: Altering swap file permanently to /etcd/fstab
      ansible.posix.mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

      # Task 1.2 Kubernetes Kernel Modules
    - name: creating config file for overlay and br_netfilter
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Adding kernel modules to linux kernel
      ansible.builtin.command: "modprobe {{ items }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

      # Task 1.3 IP forwarding by stsctl
    - name: Kubernetes sysctl config docs creating
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: '0644'

    - name: configure kernel parameters at runtime
      ansible.builtin.command: sysctl --system
      changed_when: false
      # Stage 2 : Container Runtime (CRI) & Essential packet for System Ecosystem
      # Task 2.1 getting apt packets
    - name: installing essential packets
      ansible.builtin.apt:
        update_cache: true
        force_apt_get: true
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg

    - name: Creating Keyring folder
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Installing containerd gpg keys
      ansible.builtin.get_url:
        dest: /etc/apt/keyrings/docker.asc
        url: https://download.docker.com/linux/ubuntu/gpg
        mode: '0644'

    - name: Adding to the System Docker APT repo
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: amd64
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Installing Kubernetes gpg keys
      ansible.builtin.get_url:
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        url: https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key
        mode: '0644'

    - name: Adding to the System Kubernetes APT repo
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: https://pkgs.k8s.io/core:/stable:/v1.37/deb/
        suites: /
        signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        state: present
      # Stage 2.2 Containerd and cgroup configuration and installing
    - name: Install containerd.io package
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: true

    - name: Creating containerd folder under /etc
      ansible.builtin.file:
        path: /etc/containerd
        mode: '0755'
        state: directory

    - name: 
